// Paired devices, stored encrypted (Tink AEAD) in one DataStore file.
syntax = "proto3";

package sceptrum.store;

option java_package = "com.shibi.sceptrum.store";

message PairedDevice {
  // MAC from the TV certificate, else the certificate's SHA-256 in hex.
  string id = 1;
  // Driver that talks to it: "androidtv".
  string driver = 2;
  string name = 3;
  string host = 4;
  // Control port (6466 for Android TV).
  int32 port = 5;
  // Pairing port (6467 for Android TV).
  int32 pairing_port = 6;
  // Upper-case colon MAC for Wake-on-LAN, empty when unknown.
  string mac = 7;
  // SHA-256 of the TV certificate seen at pairing: the pin for every connect.
  bytes server_cert_sha256 = 8;
  int64 paired_at_ms = 9;
  int64 last_seen_at_ms = 10;
  // Feature mask negotiated on the last session.
  int32 features = 11;
  bool has_tuner = 12;
  // Apps grid in the user's order. Only read when app_shortcuts_edited is set;
  // until then the grid shows the built-in defaults.
  repeated AppShortcut app_shortcuts = 13;
  bool app_shortcuts_edited = 14;
}

// One tile in the apps grid, launched with remote_app_link_launch_request.
message AppShortcut {
  string label = 1;
  // A URL with a scheme (https://www.youtube.com, plex://) or market://launch?id=<package>.
  string link = 2;
}

message DeviceStore {
  repeated PairedDevice devices = 1;
  // The device the remote drives; empty for none.
  string active_device_id = 2;
}
